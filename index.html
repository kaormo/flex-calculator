<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>フレックス勤務時間計算</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f5f6fa;
    margin:0;
    padding:15px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:12px;
    box-shadow:0 0 10px rgba(0,0,0,.15);
}

h1{
    text-align:center;
    color:#1f4e79;
}

.section{
    margin-bottom:20px;
}

label{
    display:block;
    margin-bottom:5px;
    font-weight:bold;
}

.row{
    display:flex;
    gap:10px;
}

.row select{
    flex:1;
    padding:10px;
    font-size:16px;
}

button{
    width:100%;
    padding:15px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:18px;
}

.calc{
    background:#0078d7;
    color:white;
}

.clear{
    background:#888;
    color:white;
}

.detail{
    background:#28a745;
    color:white;
}

.result{
    margin-top:20px;
    padding:15px;
    background:#f8f9fc;
    border-radius:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#e9f0ff;
}

.ok{
    color:green;
    font-weight:bold;
}

.ng{
    color:red;
    font-weight:bold;
}

.info{
    color:#1f4e79;
    font-weight:bold;
}

.plus{
    color:#00C853;
    background:#E8F5E9;
    border:2px solid #00C853;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
    display:inline-block;
    margin-top:8px;
}

.minus{
    color:#D50000;
    background:#FFEBEE;
    border:2px solid #D50000;
    padding:8px 12px;
    border-radius:8px;
    font-weight:bold;
    display:inline-block;
    margin-top:8px;
}

.hidden{
    display:none;
}

@media(max-width:600px){

.row{
    flex-direction:column;
}

}

.workTypeButtons{
    display:flex;
    gap:10px;
}

.shiftBtn{
    flex:1;
    width:auto;
    margin-top:0;
    height:80px;
    font-size:30px;
    font-weight:bold;
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:.2s;
}
.shiftBtn.day{
    background:#dbeafe;
    color:#1e40af;
}

.shiftBtn.night{
    background:#ffedd5;
    color:#c2410c;
}

.shiftBtn.active.day{
    background:#2563eb;
    color:white;
}

.shiftBtn.active.night{
    background:#ea580c;
    color:white;
}

.shiftBtn:hover{
    transform:scale(1.02);
}


</style>

</head>

<body>

<div class="container">

<h1>フレックス勤務時間参照</h1>

<div class="section">



<label>勤務区分</label>

<div class="workTypeButtons">

<button
type="button"
id="dayBtn"
class="shiftBtn day active"
onclick="setWorkType('day')">
☀ 昼勤
</button>

<button
type="button"
id="nightBtn"
class="shiftBtn night"
onclick="setWorkType('night')">
🌙 夜勤
</button>

</div>

<input
type="hidden"
id="workType"
value="day">



</div>

<div class="section">

<label>出勤時間</label>

<div class="row">

<select id="startHour"></select>

<select id="startMinute"></select>

</div>

</div>

<div class="section">

<label>退勤時間（任意）</label>

<div class="row">

<select id="endHour"></select>

<select id="endMinute"></select>

</div>

</div>

<button class="calc" onclick="calculate()">
計算
</button>

<button class="detail" onclick="calculateNow()">
現時刻で計算（退勤時間）
</button>    

<button class="clear" onclick="location.reload()">
クリア
</button>

<div id="result" class="result hidden">
</div>


<div id="detailArea" class="result hidden">
</div>

<script>

for(let i=0;i<24;i++){

let t=String(i).padStart(2,"0");

startHour.innerHTML +=
`<option value="${i}">${t}</option>`;

endHour.innerHTML +=
`<option value="${i}">${t}</option>`;

}

for(let i=0;i<60;i++){

let t=String(i).padStart(2,"0");

startMinute.innerHTML +=
`<option value="${i}">${t}</option>`;

endMinute.innerHTML +=
`<option value="${i}">${t}</option>`;

}

startHour.value=8;
startMinute.value=0;

let currentStart=0;
let currentMode="day";

// ====================
// 昼勤休憩
// ====================

const dayBreaks = [

[600,610],   //10:00-10:10

[730,770],   //12:10-12:50

[890,900],   //14:50-15:00

[1020,1030], //17:00-17:10

[1150,1160], //19:10-19:20

[1280,1290]  //21:20-21:30

];

// ====================
// 昼勤実働計算
// ====================

function dayWorkMinutes(start,end){

let total=end-start;

let breakTime=0;

for(let b of dayBreaks){

let overlap=

Math.max(
0,
Math.min(end,b[1])
-
Math.max(start,b[0])
);

breakTime += overlap;

}

return total-breakTime;

}

// ====================
// 夜勤休憩計算
// ====================

function nightBreakMinutes(elapsed){

let b=0;

if(elapsed>130) b+=10;

if(elapsed>290) b+=40;

if(elapsed>420) b+=10;

if(elapsed>550) b+=10;

if(elapsed>680) b+=10;

if(elapsed>810) b+=10;

return b;

}

// ====================
// 夜勤実働計算
// ====================

function nightWorkMinutes(start,end){

let span=end-start;

if(span<0){

span += 1440;

}

let breakTime=
nightBreakMinutes(span);

return span-breakTime;

}


// ====================
// 深夜実働時間計算（22:00～5:00）
// ====================

function nightPremiumMinutes(start,end){

    let finish = end;

    if(finish <= start){
        finish += 1440;
    }

    let total = 0;

    for(let t=start; t<finish; t++){

        let clock = t % 1440;

        if(clock >= 1320 || clock < 300){

            let elapsed = t - start;

            let isBreak = false;

            // 19:00～19:10
            if(elapsed >= 120 && elapsed < 130){
                isBreak = true;
            }

            // 21:10～21:50
            else if(elapsed >= 250 && elapsed < 290){
                isBreak = true;
            }

            // 00:00～00:10
            else if(elapsed >= 420 && elapsed < 430){
                isBreak = true;
            }

            // 02:00～02:10
            else if(elapsed >= 540 && elapsed < 550){
                isBreak = true;
            }

            // 04:10～04:20
            else if(elapsed >= 670 && elapsed < 680){
                isBreak = true;
            }

            // 06:20～06:30
            else if(elapsed >= 800 && elapsed < 810){
                isBreak = true;
            }

            if(!isBreak){
                total++;
            }
        }
    }

    return total;
}

// ====================
// 時刻表示
// ====================

function formatTime(min){

min=((min%1440)+1440)%1440;

let h=Math.floor(min/60);

let m=min%60;

return String(h).padStart(2,"0")
+":"
+String(m).padStart(2,"0");

}

// ====================
// 勤務時間表示
// ====================

function formatWork(min){

let h=Math.floor(min/60);

let m=min%60;

return h+"時間"
+String(m).padStart(2,"0")
+"分";

}

// ====================
// 15分切り捨て
// ====================

function floor15(min){

    return Math.floor(min/15)*15;

}

// ====================
// 5分切り捨て
// ====================

function floor5(min){

    return Math.floor(min/5)*5;

}// ====================
// 昼勤目標時刻
// ====================

function dayTargetTime(start,target){

    for(let t=start;t<=1320;t++){

        if(
            floor15(
                dayWorkMinutes(start,t)
            ) > target
        ){

            return t;

        }

    }

    return null;

}// ====================
// 夜勤目標時刻
// ====================

function nightTargetTime(start,target){

for(
let span=0;
span<=1000;
span++
){

let work=
span-
nightBreakMinutes(span);

if(work>=target){

return start+span;

}

}

return null;

}

// ====================
// フレックス超過時間表示
// ====================

function getFlexHtml(actual){

    let workTime = floor15(actual);

    let flexDiff = workTime - 480;

    if(flexDiff > 0){

        return "<div class='plus'>"
            + "フレックス超過時間：+"
            + formatWork(flexDiff)
            + "</div>";

    }

    if(flexDiff < 0){

        return "<div class='minus'>"
            + "フレックス超過時間：-"
            + formatWork(Math.abs(flexDiff))
            + "</div>";

    }

    return "";

}
// ====================
// 勤務区分切替
// ====================

function setWorkType(type){

    document.getElementById("workType").value = type;

    document.getElementById("dayBtn")
        .classList.remove("active");

    document.getElementById("nightBtn")
        .classList.remove("active");

    if(type==="day"){

        document.getElementById("dayBtn")
            .classList.add("active");

    }else{

        document.getElementById("nightBtn")
            .classList.add("active");

    }

}


// ====================
// 現時刻で計算
// ====================

function calculateNow(){

    const now = new Date();

    endHour.value = now.getHours();

    endMinute.value = now.getMinutes();

    calculate(true);

}    

// ====================
// メイン計算
// ====================

function calculate(isNow=false){

currentMode =
document.getElementById(
"workType"
).value;

let sh=
Number(
startHour.value
);

let sm=
Number(
startMinute.value
);

currentStart=
sh*60+sm;

if(currentMode==="night"){

    if(currentStart < 1020){

        currentStart = 1020;

    }

}

if(
endHour.selectedIndex >=0 &&
endMinute.selectedIndex <0
){
endMinute.selectedIndex=0;
}

let hasEnd=
endHour.selectedIndex>=0;

let html="";

// ====================
// 昼勤
// ====================

if(currentMode==="day"){

let work1450=
dayWorkMinutes(
currentStart,
890
);

if(!isNow){

    html +=
    "<h2>14:50時点勤務時間</h2>";

    html +=
    "<p class='info'>";

    html +=
    "実働："
    +
    formatWork(work1450);

    html +=
    "<br>";

    html +=
    "勤務時間："
    +
    formatWork(
    floor15(work1450)
    );

    html +=
    "</p>";

    html +=
    "<hr>";

}

if(!hasEnd){

html +=
"<h2>次の勤務時間目安</h2>";

html +=
"<table>";

html +=
"<tr><th>勤務時間</th><th>到達時刻</th></tr>";

let startTarget=
Math.floor(
floor15(work1450)/15
)*15
+15;

for(
let work=startTarget;
work<=660;
work+=15
){

let t=
dayTargetTime(
currentStart,
work
);

if(t){

html +=
"<tr><td>"
+
formatWork(work)
+
"</td><td>"
+
formatTime(t)
+
"</td></tr>";

}
}

html +=
"</table>";

html +=
"<hr>";

let work2200=
dayWorkMinutes(
currentStart,
1320
);

html +=
"<h2>22:00時点勤務時間</h2>";

html +=
"<p class='info'>";

html +=
"実働："
+
formatWork(work2200);

html +=
"<br>";

html +=
"勤務時間："
+
formatWork(
floor15(work2200)
);

html +=
"</p>";


}else{

let end=
Number(endHour.value)
*60
+
Number(endMinute.value);

let actual=
dayWorkMinutes(
currentStart,
end
);

html +=
"<h2>本日の勤務時間</h2>";

html +=
"<p class='info'>開始時刻："
+
formatTime(currentStart)
+
"</p>";

html +=
"<p>";

html +=
"実働：<b>"
+
formatWork(actual)
+
"</b><br>";

html +=
"勤務時間：<b>"
+
formatWork(
floor15(actual)
)
+
"</b>";

html +=
"</p>";

html +=
getFlexHtml(actual);

html +=
"<hr>";
// ====================
// 昼勤（退勤入力あり）の続き
// ====================

let coreOK =
currentStart <= 610
&&
end >= 890;

if(coreOK){

html +=
"<p class='ok'>〇 コアタイム適合</p>";

}else{

html +=
"<p class='ng'>× コアタイム不足</p>";

}


}

}

// ====================
// 夜勤
// ====================

else{

if(!hasEnd){

let target=
nightTargetTime(
currentStart,
480
);

html +=
"<h2>8時間勤務到達時刻</h2>";

html +=
"<p class='info'>";

if(target>=1440){

html +=
"翌 "
+
formatTime(target);

}else{

html +=
formatTime(target);

}

html +=
"</p>";



}else{

let end=
Number(endHour.value)
*60
+
Number(endMinute.value);

let actual=
nightWorkMinutes(
currentStart,
end
);

html +=
"<h2>本日の勤務時間</h2>";

html +=
"<p class='info'>開始時刻："
+
formatTime(currentStart)
+
"</p>";

html +=
"<p>";

html +=
"実働：<b>"
+
formatWork(actual)
+
"</b><br>";

html +=
"勤務時間：<b>"
+
formatWork(
floor15(actual)
)
+
"</b>";

let nightPremium =
nightPremiumMinutes(
currentStart,
end
);

html +=
"<br>深夜勤務時間(22:00～5:00)：<b>"
+
formatWork(
    floor5(nightPremium)
)
+
"</b>";


html +=
"</p>";

html +=
getFlexHtml(actual);

let shortage=
Math.max(
0,
480-floor15(actual)
);

if(shortage>0){

html +=
"<p class='info'>";

html +=
"8時間不足："
+
formatWork(shortage);

html +=
"</p>";

}

html +=
"<hr>";

let shiftText=
"対象外";

if(
currentStart>=720
&&
actual>=480
){

let compare=end;

if(compare<currentStart){

compare +=1440;

}

if(compare<=1570){

shiftText=
"交代A";

}else{

shiftText=
"交代B";

}

}

html +=
"<h2>交代勤務</h2>";

html +=
"<p class='info'>"
+
shiftText
+
"</p>";

if(
shiftText==="対象外"
){

if(actual<480){

html +=
"<p>（実働8時間未満）</p>";

}else if(
currentStart<720
){

html +=
"<p>（12:00前出勤）</p>";

}

}


}

}

result.innerHTML=
html;

result.classList
.remove("hidden");

detailArea.classList
.add("hidden");

}

// ====================
// 初期設定
// ====================

endHour.selectedIndex=-1;
endMinute.selectedIndex=-1;

</script>

</body>
</html>
